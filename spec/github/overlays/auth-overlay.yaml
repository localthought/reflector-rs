overlay: 1.0.0
info:
  title: GitHub Issues API Authentication Profile
  version: 1.0.0
# GitHub is authenticated with a static personal-access / installation token,
# not an interactive OAuth flow, so — unlike the Google Calendar auth overlay —
# this declares an `http`/`bearer` security scheme rather than an `oauth2`
# authorizationCode flow. Reflector's StaticTokenManager sends the configured
# token as `Authorization: Bearer <token>`; the API base is read from the
# document's `servers`. The base document already carries this scheme; the
# overlay states it explicitly so the auth intent travels with the overlays.
actions:
  - target: $.components.securitySchemes
    update:
      githubToken:
        type: http
        scheme: bearer
        description: >
          GitHub personal-access or installation token, sent as a bearer
          token. Supplied as deployment configuration, not via OAuth.
