[package]
name = "reflector-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Reflects a REST API described by an OpenAPI document + Overlays into an Atomic Data Storelike."
repository = "https://github.com/localthought/reflector-rs"

[dependencies]
# The Atomic Data library that defines `Storelike`. Pinned to a revision of the
# ontola fork rather than the crates.io release: this scaffold is written
# against that fork's async `Storelike` and typed `Subject` (`internal:/…`),
# which the published 0.40 does not have yet.
atomic_lib = { git = "https://github.com/ontola/atomic-server", rev = "fc045025536c1694b0c0d63024cb5ebe2db3d5c0" }

# `syncables-rs` is the sync engine this binary is a host for. The crate does
# not exist yet — the API reflector-rs needs is specified in `src/syncables.rs`
# and tracked as issues on localthought/syncables-rs (see that module's docs).
# Once it lands, drop the local module and switch this on:
# syncables = { package = "syncables-rs", git = "https://github.com/localthought/syncables-rs" }

anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
