[package]
name = "reflector-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Reflects a REST API described by an OpenAPI document + Overlays into an Atomic Data Storelike."
repository = "https://github.com/localthought/reflector-rs"

[dependencies]
# `syncables-rs` is the sync engine this binary is a host for. Not published
# to crates.io yet, so it's pinned to a revision by git instead.
syncables = { git = "https://github.com/localthought/syncables-rs", rev = "9197f14deec88e612910606a2aeafc5d846a5033" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
indexmap = "2"
reqwest = { version = "0.13", features = ["form", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

# The Atomic Data library that defines `Storelike`. Pinned to a revision of
# the ontola fork rather than the crates.io release: this scaffold is written
# against that fork's async `Storelike` and typed `Subject` (`internal:/…`),
# which the published 0.40 does not have yet. `db-redb`'s comment in that
# fork's own Cargo.toml notes it "works in WASM with InMemoryBackend", and
# `wasm` supplies the JS-backed randomness that needs — see the "WASM
# compatibility" section in README.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic_lib = { git = "https://github.com/ontola/atomic-server", rev = "fc045025536c1694b0c0d63024cb5ebe2db3d5c0", features = ["db-redb"] }
# The OAuth fallback's local callback server (src/oauth.rs) — a web interface
# for the authorization-code dance when no valid API_TOKEN is configured.
# Binding a real TCP listener has no wasm32 equivalent, so this whole module
# is native-only (see the `#[cfg]` on `pub mod oauth` in src/lib.rs).
axum = "0.8"
rand = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
atomic_lib = { git = "https://github.com/ontola/atomic-server", rev = "fc045025536c1694b0c0d63024cb5ebe2db3d5c0", features = ["db-redb", "wasm"] }
# `ulid` (via atomic_lib) pulls in `rand` 0.9 -> `getrandom` 0.3, which needs
# its `wasm_js` feature *and* the `getrandom_backend="wasm_js"` cfg
# (.cargo/config.toml) to build for wasm32 — the feature alone isn't enough.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
