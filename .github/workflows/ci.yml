name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the library for wasm32 (the binary — main.rs's OAuth server and #[tokio::main] runtime — is native-only)
        run: cargo build --locked --target wasm32-unknown-unknown --lib
      - run: cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
